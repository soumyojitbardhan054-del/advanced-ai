<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Sky! 🎂</title>
  
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button id="musicBtn" class="music-toggle" onclick="toggleMusic()">🎵 Play Music</button>
  <audio id="bgMusic" loop src="happy-birthday.mp3"></audio>

  <div class="card">

    <div class="countdown-container" id="countdownBox">
      <span class="countdown-label">⏳ Countdown to Sky's Big Day:</span>
      <div id="timer" class="timer-display">Loading timer...</div>
    </div>

    <div class="encouragement-bar">
      <span class="tag">🌟 Dream Big</span>
      <span class="tag">🚀 Keep Glowing</span>
      <span class="tag">✨ Unlimited Potential</span>
    </div>

    <h1>Happy Birthday, Sky! 🎉</h1>

    <div class="cake-container" onclick="blowCandle()" title="Click to blow out the candle!">
      <div class="flame" id="flame"></div>
      <div class="candle"></div>
      <div class="cake-top"></div>
      <div class="cake-base"></div>
    </div>
    <p id="candleText" class="candle-hint">Tap the flame to make a wish & blow it out! 🕯️</p>

    <button class="celebrate-btn" onclick="launchConfetti()">Pop Confetti! 🥳</button>

    <div class="tabs">
      <button class="tab-btn active" onclick="showWish(0, this)">🎉 From Both of Us</button>
      <button class="tab-btn" onclick="showWish(1, this)">💙 From Me</button>
      <button class="tab-btn" onclick="showWish(2, this)">💖 From Jia</button>
    </div>

    <div class="wish-box" id="wishDisplay"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
